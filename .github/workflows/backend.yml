name: Backend validation
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, test real SQLite and package
        shell: bash
        run: ./mvnw -B -ntp verify
      - name: Reproduce backend laboratory
        if: runner.os == 'Linux'
        run: python3 tools/lab.py --output lab-output/ci
      - name: Preserve test and lab results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-evidence-${{ matrix.os }}
          path: |
            target/surefire-reports/*.xml
            lab-output/ci/*.json
            lab-output/ci/*.log
          if-no-files-found: warn
